[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaseq_mini_pipeline"
version = "0.1.0"
description = "RNA-seq QC pipeline with PostgreSQL ETL"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Laroussi Bachri", email = "bachri.laroussi-labid@utoulouse.fr" }
]
dependencies = [
    "pandas==2.0.3",
    "numpy==1.24.3",
    "matplotlib==3.7.2",
    "scikit-learn==1.3.0",
    "sqlalchemy==2.0.19",
    "psycopg2-binary==2.9.7",
    "PyYAML==6.0",
    "streamlit==1.25.0",
    "seaborn==0.12.2",
    "dotenv==0.9.9"

]

[project.optional-dependencies]
dev = [
    "pytest==7.4.0",
    "pytest-cov==4.1.0",
    "flake8==6.0.0",
    "mypy==1.4.1"
]

[project.urls]
Homepage = "https://github.com/bachrilrs/rnaseq_mini_pipeline"
Repository = "https://github.com/bachrilrs/rnaseq_mini_pipeline"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["rnaseq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -v"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true