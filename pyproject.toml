[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaseq_mini_pipeline"
version = "0.1.0"
description = "Production-grade RNA-seq QC and differential expression pipeline with PostgreSQL ETL integration"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Laroussi Bachri", email = "bachri.laroussi-labid@utoulouse.fr" }
]
keywords = [
    "bioinformatics",
    "rna-seq",
    "qc",
    "quality-control",
    "differential-expression",
    "etl",
    "pipeline",
    "transcriptomics",
    "postgresql",
    "data-science"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps",
    "Topic :: Database",
    "Typing :: Typed"
]
dependencies = [
    "pandas>=1.3.0,<3.0",
    "numpy>=1.21.0,<2.0",
    "seaborn>=0.11.0",
    "matplotlib>=3.4.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.8.0",
    "sqlalchemy>=1.4.0,<2.1",
    "psycopg2-binary>=2.9.0",
    "PyYAML>=5.4.1",
    "python-dotenv>=1.2.1",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0",
    "types-python-dateutil>=2.8",
    "pylint>=2.17.0",
    "pre-commit>=3.0.0"
]

docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "sphinx-autodoc-typehints>=1.22.0"
]

database = [
    "alembic>=1.11.0",
    "psycopg[binary]>=3.1.0"
]

[project.scripts]
rnaseq-pipeline = "rnaseq.pipeline:main"
rnaseq-qc = "rnaseq.cli:qc_command"
rnaseq-de = "rnaseq.cli:de_command"
rnaseq-db = "rnaseq.cli:database_command"

[project.urls]
Homepage = "https://github.com/bachrilrs/rnaseq_mini_pipeline"
Documentation = "https://github.com/bachrilrs/rnaseq_mini_pipeline#readme"
Repository = "https://github.com/bachrilrs/rnaseq_mini_pipeline"
"Bug Tracker" = "https://github.com/bachrilrs/rnaseq_mini_pipeline/issues"
"Source Code" = "https://github.com/bachrilrs/rnaseq_mini_pipeline"
LinkedIn = "https://www.linkedin.com/in/laroussi-bachri"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["rnaseq*"]

[tool.setuptools.package-data]
rnaseq = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --tb=short --verbose"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]
minversion = "7.0"

[tool.coverage.run]
source = ["src/rnaseq"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__main__.py",
    "*/cli.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@abstractmethod",
    "if sys.version_info",
    "\\.\\.\\."
]
precision = 2
show_missing = true
skip_covered = false

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | \.eggs
  | venv
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["rnaseq"]
known_third_party = ["pandas", "numpy", "sklearn", "sqlalchemy", "yaml"]
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
show_error_context = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "seaborn.*",
    "matplotlib.*",
    "sklearn.*"
]
ignore_missing_imports = true

[tool.pylint]
max-line-length = 100
fail-under = 8.0
load-plugins = []

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503", "E501"]
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "build",
    "dist",
    ".tox"
]
per-file-ignores = [
    "__init__.py:F401"
]

[tool.bandit]
exclude_dirs = ["tests", "venv"]
skips = ["B101"]

[tool.semantic_release]
version_pattern = "v{version}"
version_toml = [
    "pyproject.toml:project.version"
]
branch = "main"
changelog_file = "CHANGELOG.md"