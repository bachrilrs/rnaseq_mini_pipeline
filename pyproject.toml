[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaseq_mini_pipeline"
version = "0.1.0"
description = "Production-grade RNA-seq QC and differential expression pipeline with PostgreSQL ETL integration"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Laroussi Bachri", email = "bachri.laroussi-labid@utoulouse.fr" }
]
keywords = [
    "bioinformatics",
    "rna-seq",
    "qc",
    "quality-control",
    "postgresql",
    "etl"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11"
]
dependencies = [
    "pandas>=1.3.0,<3.0",
    "numpy>=1.21.0,<2.0",
    "matplotlib>=3.4.0",
    "scikit-learn>=1.2.0",
    "sqlalchemy>=1.4.0,<2.1",
    "psycopg2-binary>=2.9.0",
    "PyYAML>=5.4.1",
    "streamlit>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/bachrilrs/rnaseq_mini_pipeline"
Repository = "https://github.com/bachrilrs/rnaseq_mini_pipeline"
"Bug Tracker" = "https://github.com/bachrilrs/rnaseq_mini_pipeline/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["rnaseq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--tb=short --verbose"

[tool.coverage.run]
source = ["src/rnaseq"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError"
]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true