services:
  db:
    image: postgres:16
    container_name: rnaseq_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rnaseq_db}
      POSTGRES_USER: ${POSTGRES_USER:-rnaseq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rnaseq_password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rnaseq_user}"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pipeline:
    build: .
    container_name: rnaseq_mini_pipeline
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: ${POSTGRES_USER:-rnaseq_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-rnaseq_password}
      DB_NAME: ${POSTGRES_DB:-rnaseq_db}
      DB_PORT: 5432
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    stdin_open: true
    tty: true

volumes:
  postgres_data: